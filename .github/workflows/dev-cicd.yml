name: CI/CD -  Dev/QA

# Purpose:
# - PR to dev: validate feature or bugfix branches before they enter dev.
# - Push to dev: build, test, package, and deploy the integrated code to QA.
#
# Branch model:
# feature/* or bugfix/* -> PR -> dev -> automatic QA deployment
#
# Requires:
# Environment named 'QA' with the following variables and secrets:
# - AZURE_WEBAPP: Name of the Azure Web App for QA - variable
# - AZURE_PUBLISHPROFILE: Publish profile for the QA environment - secret

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Shared CI gate for PRs into dev and pushes to dev.
  build-test:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact-meta.outputs.artifact_name }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
          pip install ruff bandit pip-audit pytest

      - name: Code quality test (Lint)
        run: |
          source antenv/bin/activate
          ruff check . || true

      - name: SAST scan (Bandit)
        run: |
          source antenv/bin/activate
          bandit -r . --exclude ./antenv,./tests -ll

      - name: Dependency security scan
        run: |
          source antenv/bin/activate
          pip-audit -r requirements.txt || true

      - name: Run unit tests
        run: |
          source antenv/bin/activate
          pytest

      - name: Select artifact identity
        id: artifact-meta
        shell: bash
        run: |
          echo "artifact_name=python-app-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Prepare deploy package
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p deploy-package
          rsync -a ./ deploy-package/ \
            --exclude 'deploy-package/' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'antenv/' \
            --exclude 'tests/' \
            --exclude '.pytest_cache/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc'
          echo "${GITHUB_SHA}" > deploy-package/artifact-sha.txt

      - name: Upload deploy-package artifact
        # PRs into dev validate only. QA deployment happens after merge to dev.
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-meta.outputs.artifact_name }}
          retention-days: 7
          path: deploy-package/

  # Automatic QA deployment after code is merged into dev.
  deploy-qa:
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: ubuntu-latest
    needs: build-test
    concurrency:
      group: ${{ github.repository }}-qa-deploy
      cancel-in-progress: true
    environment:
      name: QA
      url: https://${{ vars.AZURE_WEBAPP }}.azurewebsites.net

    steps:
      - name: Download deploy package artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-test.outputs.artifact_name }}

      - name: Verify artifact identity
        shell: bash
        run: |
          ACTUAL_SHA="$(cat artifact-sha.txt)"
          if [ "$ACTUAL_SHA" != "${GITHUB_SHA}" ]; then
            echo "Artifact SHA mismatch: expected ${GITHUB_SHA}, got $ACTUAL_SHA"
            exit 1
          fi

      - name: Deploy to QA
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP }}
          publish-profile: ${{ secrets.AZURE_PUBLISHPROFILE }}