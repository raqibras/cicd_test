name: CI/CD -  Dev/QA

# Purpose:
# - PR to dev: validate feature or bugfix branches before they enter dev.
# - Push to dev: build, test, package, and deploy the integrated code to QA.
#
# Branch model:
# feature/* or bugfix/* , etc -> PR -> dev -> automatic QA deployment


on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Shared CI gate for PRs into dev and pushes to dev.
  build-test:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact-meta.outputs.artifact_name }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --locked --all-groups

      - name: SAST scan (Bandit)
        continue-on-error: true
        shell: bash
        run: uv run bandit -r . --exclude ./.venv,./tests -ll

      - name: Dependency security scan
        continue-on-error: true
        shell: bash
        run: uv run pip-audit

      - name: Select artifact identity
        if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
        id: artifact-meta
        shell: bash
        run: |
          echo "artifact_name=python-app-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Prepare deploy package
        if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p deploy-package
          rsync -a ./ deploy-package/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'antenv/' \
            --exclude '.venv/' \
            --exclude 'tests/' \
            --exclude '.pytest_cache/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc'
          uv export --locked --no-dev --no-hashes --no-emit-project \
            -o deploy-package/requirements.txt
          echo "${GITHUB_SHA}" > deploy-package/artifact-sha.txt
      
      # Upload deploy-package artifact. Happens after merge to dev.    
      - name: Upload deploy-package artifact
        if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-meta.outputs.artifact_name }}
          retention-days: 21
          path: deploy-package/
          overwrite: true

  # Automatic QA deployment after code is merged into dev.
  deploy-qa:
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
    concurrency:
      group: ${{ github.repository }}-qa-deploy
      cancel-in-progress: true
    environment:
      name: QA

    steps:
      - name: Download deploy package artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-test.outputs.artifact_name }}

      - name: Verify artifact identity
        shell: bash
        run: |
          ACTUAL_SHA="$(cat artifact-sha.txt)"
          if [ "$ACTUAL_SHA" != "${GITHUB_SHA}" ]; then
            echo "Artifact SHA mismatch: expected ${GITHUB_SHA}, got $ACTUAL_SHA"
            exit 1
          fi


      - name: Deploy to QA
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP }}
          publish-profile: ${{ secrets.APPSERVICE_PUBLISHPROFILE }}