name: CI/CD - Production

# Purpose:
# - PR to main: validate the production candidate before merge.
# - Push to main: deploy production and create a release tag.
#
# Branch model:
# dev -> PR -> main -> production deployment
# main should be protected: no direct pushes, required PR review, required checks.
# Requires:
# Environment named 'Production' with the following variables and secrets:
# - AZURE_WEBAPP: Name of the Azure Web App for Production - variable
# - AZURE_PUBLISHPROFILE: Publish profile for the Production environment - secret

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'

jobs:
  # Validate PRs into main and production pushes.
  build-test:
    runs-on: ubuntu-latest
    outputs:
      artifact_sha: ${{ steps.artifact-meta.outputs.artifact_sha }}
      artifact_name: ${{ steps.artifact-meta.outputs.artifact_name }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # For PR validation, test the source commit from dev rather than GitHub's temporary merge SHA.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Require dev source for production PRs
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "Only pull requests from 'dev' to 'main' are allowed for production promotion."
            echo "Current source branch: ${{ github.head_ref }}"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
          pip install bandit pip-audit pytest

      - name: SAST scan (Bandit)
        run: |
          source antenv/bin/activate
          bandit -r . --exclude ./antenv,./tests -ll

      - name: Dependency security scan
        run: |
          source antenv/bin/activate
          pip-audit -r requirements.txt || true


      - name: Run unit tests
        run: |
          source antenv/bin/activate
          pytest

      - name: Select artifact identity
        id: artifact-meta
        shell: bash
        run: |
          SHA="$GITHUB_SHA"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SHA="${{ github.event.pull_request.head.sha }}"
          fi
          echo "artifact_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "artifact_name=python-app-$SHA" >> "$GITHUB_OUTPUT"

      - name: Prepare deploy package
        shell: bash
        run: |
          mkdir -p deploy-package
          rsync -a ./ deploy-package/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'antenv/' \
            --exclude 'tests/' \
            --exclude 'cicd_old/' \
            --exclude '.pytest_cache/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc'
          echo "${{ steps.artifact-meta.outputs.artifact_sha }}" > deploy-package/artifact-sha.txt

      - name: Upload artifact
        # PRs into main store the production candidate artifact.
        # Pushes to main store a fallback artifact for manual/direct recovery scenarios.
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-meta.outputs.artifact_name }}
          retention-days: 30
          path: deploy-package/

  # Production deployment after dev is merged into main.
  # Configure required reviewers on the GitHub "production" environment.
  deploy-prod:
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    needs: build-test
    concurrency:
      group: ${{ github.repository }}-prod-deploy
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: read
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP }}.azurewebsites.net

    steps:
      - name: Resolve promoted artifact from merged PR
        id: promoted
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const commitSha = context.sha;

            const response = await github.request('GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls', {
              owner,
              repo,
              commit_sha: commitSha,
              mediaType: { previews: ['groot'] }
            });

            const mergedPr = response.data.find((pr) => pr.merged_at);
            if (!mergedPr) {
              core.setFailed('Production deploy requires main to be updated by a merged PR from dev. No merged PR found.');
              return;
            }

            if (mergedPr.head.ref !== 'dev') {
              core.setFailed(`Production deploy blocked: PR source was '${mergedPr.head.ref}'. Only dev -> main is allowed.`);
              return;
            }

            const artifactSha = mergedPr.head.sha;

            // Find the dev-cicd.yml run that built this exact commit
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'dev-cicd.yml',
              head_sha: artifactSha,
              status: 'success',
            });

            if (runs.data.workflow_runs.length === 0) {
              core.setFailed(`No successful dev-cicd.yml run found for commit ${artifactSha}`);
              return;
            }

            // Most recent successful run for that SHA
            const run = runs.data.workflow_runs[0];

            core.setOutput('artifact_sha', artifactSha);
            core.setOutput('artifact_name', `python-app-${artifactSha}`);
            core.setOutput('run_id', run.id);
            core.info(`Promoting artifact from PR #${mergedPr.number}: ${artifactSha} (run ${run.id})`);

      - name: Download promoted artifact from PR validation
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.promoted.outputs.artifact_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.promoted.outputs.run_id }}

      - name: Verify promoted artifact identity
        shell: bash
        run: |
          EXPECTED_SHA="${{ steps.promoted.outputs.artifact_sha }}"
          ACTUAL_SHA="$(cat artifact-sha.txt)"
          echo "Expected SHA: $EXPECTED_SHA"
          echo "Actual SHA: $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Artifact SHA mismatch: expected $EXPECTED_SHA, got $ACTUAL_SHA"
            exit 1
          fi

      - name: Deploy to Production
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP }}
          publish-profile: ${{ secrets.AZURE_PUBLISHPROFILE }}

  # Create a rollback point only after production deploy succeeds.
  tag-release:
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    needs: deploy-prod
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create release tag
        run: |
          TAG="release-$(date +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          git tag "$TAG"
          git push origin "$TAG"