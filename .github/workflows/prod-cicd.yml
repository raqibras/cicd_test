name: CI/CD - Production

# Purpose:
#
# - PR dev -> main:
#     Validate the production candidate and verify that the exact
#     dev-cicd artifact exists for the PR HEAD commit.
#
# - Push to main:
#     Resolve the merged dev -> main PR, identify the exact artifact
#     produced by dev-cicd for the PR HEAD SHA, verify it, deploy it,
#     and create a release tag.
#
# Requires:
# Environment named 'Production' with the following variables and secrets:
# - AZURE_WEBAPP: Name of the Azure Web App for Production - variable
# - AZURE_PUBLISHPROFILE: Publish profile for the Production environment - secret
#
# Artifact promotion model:
#
#   dev commit
#     -> dev-cicd.yml
#     -> build + test + security scan
#     -> immutable artifact
#     -> Deploy to QA
#     -> PR dev -> main
#     -> production PR validation
#     -> merge
#     -> production downloads EXACT dev-cicd artifact
#     -> verify artifact
#     -> deploy production
#     -> create release tag

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main


permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'
  DEV_WORKFLOW_FILE: 'dev-cicd.yml'

jobs:
  # This job validates the PR source code.
  # This job does NOT build or upload another production artifact.
  # The deployable artifact must come from dev-cicd.yml.
  PR-Validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
  

    steps:
      - name: Checkout PR source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify PR source branch
        shell: bash
        run: |
          echo "Source branch : ${{ github.head_ref }}"
          echo "Target branch : ${{ github.base_ref }}"
          echo "PR HEAD SHA   : ${{ github.event.pull_request.head.sha }}"

          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "Production promotion is only allowed from dev."
            exit 1
          fi

          if [ "${{ github.base_ref }}" != "main" ]; then
            echo "Production promotion must target main."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m venv antenv
          source antenv/bin/activate

          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit pytest

      - name: SAST scan - Bandit
        shell: bash
        run: |
          source antenv/bin/activate
          bandit -r . \
            --exclude ./antenv,./tests \
            -ll

      - name: Dependency security scan - pip-audit
        continue-on-error: true
        shell: bash
        run: |
          source antenv/bin/activate
          pip-audit -r requirements.txt

      - name: Run unit tests
        shell: bash
        run: |
          source antenv/bin/activate
          pytest

      - name: Verify promoted dev artifact exists
        id: dev-artifact
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifactSha = context.payload.pull_request.head.sha;
            const workflowFile = process.env.DEV_WORKFLOW_FILE;

            core.info(`PR HEAD SHA: ${artifactSha}`);
            core.info(`Expected workflow: ${workflowFile}`);

            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowFile,
              head_sha: artifactSha,
              status: 'success',
              per_page: 100
            });

            if (runs.data.workflow_runs.length === 0) {
              core.setFailed(
                `No successful ${workflowFile} run found for PR HEAD ${artifactSha}.`
              );
              return;
            }

            const run = runs.data.workflow_runs[0];

            core.info(`Dev CI run ID: ${run.id}`);
            core.info(`Dev CI run URL: ${run.html_url}`);

            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: run.id,
              per_page: 100
            });

            const expectedArtifactName = `python-app-${artifactSha}`;

            const artifact = artifacts.data.artifacts.find(
              (a) => a.name === expectedArtifactName && !a.expired
            );

            if (!artifact) {
              core.setFailed(
                `Expected artifact '${expectedArtifactName}' was not found ` +
                `or has expired in dev-cicd run ${run.id}.`
              );
              return;
            }

            core.info(`Artifact ID: ${artifact.id}`);
            core.info(`Artifact name: ${artifact.name}`);
            core.info(`Artifact digest: ${artifact.digest}`);

            core.setOutput('run_id', run.id);
            core.setOutput('artifact_id', artifact.id);
            core.setOutput('artifact_name', artifact.name);
            core.setOutput('artifact_digest', artifact.digest);
            core.setOutput('artifact_sha', artifactSha);

      - name: Production artifact validation summary
        run: |
          echo "=============================================="
          echo "Production candidate validated successfully"
          echo "=============================================="
          echo "PR HEAD SHA      : ${{ steps.dev-artifact.outputs.artifact_sha }}"
          echo "Dev CI Run ID    : ${{ steps.dev-artifact.outputs.run_id }}"
          echo "Artifact ID      : ${{ steps.dev-artifact.outputs.artifact_id }}"
          echo "Artifact Name    : ${{ steps.dev-artifact.outputs.artifact_name }}"
          echo "Artifact Digest  : ${{ steps.dev-artifact.outputs.artifact_digest }}" 
          echo "=============================================="

  # Production Deployment
  Deploy-Prod:
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    concurrency:
      group: ${{ github.repository }}-prod-deploy
      cancel-in-progress: false
    environment:
      name: Production
      url: https://${{ vars.AZURE_WEBAPP }}.azurewebsites.net

    steps:
      - name: Resolve promoted artifact from merged PR  # Resolve the exact PR that produced the current main SHA.
        id: promoted
        uses: actions/github-script@v7
        env:
          DEV_WORKFLOW_FILE: ${{ env.DEV_WORKFLOW_FILE }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const commitSha = context.sha;
            const workflowFile = process.env.DEV_WORKFLOW_FILE;

            core.info(`Current main SHA: ${commitSha}`);

            const response = await github.request(
              'GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls',
              {
                owner,
                repo,
                commit_sha: commitSha,
                headers: {
                  'X-GitHub-Api-Version': '2022-11-28'
                }
              }
            );

            const mergedPr = response.data.find(
              (pr) =>
                pr.merged_at &&
                pr.base.ref === 'main' &&
                pr.head.ref === 'dev' &&
                pr.merge_commit_sha === commitSha
            );

            if (!mergedPr) {
              core.setFailed(
                `Production deploy blocked. No merged dev -> main PR ` +
                `was found whose merge_commit_sha matches ${commitSha}.`
              );
              return;
            }

            core.info(`PR number       : #${mergedPr.number}`);
            core.info(`PR source       : ${mergedPr.head.ref}`);
            core.info(`PR target       : ${mergedPr.base.ref}`);
            core.info(`PR head SHA     : ${mergedPr.head.sha}`);
            core.info(`Merge commit SHA: ${mergedPr.merge_commit_sha}`);

            if (mergedPr.head.ref !== 'dev') {
              core.setFailed(
                `Production deploy blocked: source branch is '${mergedPr.head.ref}'.`
              );
              return;
            }

            if (mergedPr.base.ref !== 'main') {
              core.setFailed(
                `Production deploy blocked: target branch is '${mergedPr.base.ref}'.`
              );
              return;
            }

            if (mergedPr.merge_commit_sha !== commitSha) {
              core.setFailed(
                `Production deploy blocked: PR merge commit ` +
                `${mergedPr.merge_commit_sha} does not match current main SHA ${commitSha}.`
              );
              return;
            }

            const artifactSha = mergedPr.head.sha;
            const expectedArtifactName = `python-app-${artifactSha}`;

            // ----------------------------------------------------
            // Find successful dev-cicd run for the exact PR HEAD.
            // ----------------------------------------------------
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowFile,
              head_sha: artifactSha,
              status: 'success',
              per_page: 100
            });

            if (runs.data.workflow_runs.length === 0) {
              core.setFailed(
                `No successful ${workflowFile} run found for commit ${artifactSha}.`
              );
              return;
            }

            const run = runs.data.workflow_runs[0];

            core.info(`Dev CI run ID: ${run.id}`);
            core.info(`Dev CI URL   : ${run.html_url}`);

            // ----------------------------------------------------
            // Find exact artifact in that run.
            // ----------------------------------------------------
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: run.id,
              per_page: 100
            });

            const artifact = artifacts.data.artifacts.find(
              (a) => a.name === expectedArtifactName && !a.expired
            );

            if (!artifact) {
              core.setFailed(
                `Expected artifact '${expectedArtifactName}' ` +
                `was not found or has expired in dev-cicd run ${run.id}.`
              );
              return;
            }

            core.info(`Artifact ID     : ${artifact.id}`);
            core.info(`Artifact Name   : ${artifact.name}`);
            core.info(`Artifact Digest : ${artifact.digest}`);

            core.setOutput('pr_number', mergedPr.number);
            core.setOutput('artifact_sha', artifactSha);
            core.setOutput('artifact_name', artifact.name);
            core.setOutput('artifact_id', artifact.id);
            core.setOutput('artifact_digest', artifact.digest);
            core.setOutput('run_id', run.id);
            core.setOutput('merge_commit_sha', mergedPr.merge_commit_sha);


      - name: Download promoted artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.promoted.outputs.artifact_id }}
        run: |
          echo "Downloading artifact ID: $ARTIFACT_ID"

          curl -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o promoted-artifact.zip

          ls -lh promoted-artifact.zip

  
      - name: Validate artifact digest
        id: digest
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ steps.promoted.outputs.artifact_digest }}
        run: |
          ACTUAL_DIGEST=$(sha256sum promoted-artifact.zip | awk '{print $1}')

          echo "Downloaded artifact SHA-256: $ACTUAL_DIGEST"

          echo "actual_digest=$ACTUAL_DIGEST" >> "$GITHUB_OUTPUT" 
          EXPECTED_DIGEST="${EXPECTED_DIGEST#sha256:}"

              echo "Expected GitHub digest : $EXPECTED_DIGEST"
              echo "Actual downloaded hash : $ACTUAL_DIGEST"

              if [ "$ACTUAL_DIGEST" != "$EXPECTED_DIGEST" ]; then
                echo "ERROR: Artifact digest mismatch."
                exit 1
              fi

              echo "Artifact digest verified successfully."
       


      - name: Extract verified artifact
        shell: bash
        run: |
          mkdir -p deploy-package

          unzip -q promoted-artifact.zip -d deploy-package

          echo "Verified artifact extracted successfully."


      - name: Deploy to Production
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP }}
          publish-profile: ${{ secrets.AZURE_PUBLISHPROFILE }}
          package: ./deploy-package

      - name: Production deployment summary
        run: |
          echo "=============================================="
          echo "Production deployment successful"
          echo "=============================================="
          echo "PR Number        : #${{ steps.promoted.outputs.pr_number }}"
          echo "Source SHA       : ${{ steps.promoted.outputs.artifact_sha }}"
          echo "Merge SHA        : ${{ steps.promoted.outputs.merge_commit_sha }}"
          echo "Dev CI Run ID    : ${{ steps.promoted.outputs.run_id }}"
          echo "Artifact ID      : ${{ steps.promoted.outputs.artifact_id }}"
          echo "Artifact Name    : ${{ steps.promoted.outputs.artifact_name }}"
          echo "Artifact Digest  : ${{ steps.promoted.outputs.artifact_digest }}"
          echo "=============================================="

  # Release Tag
  Tag-Release:
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    needs:
      - Deploy-Prod
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag
        shell: bash
        run: |
          TAG="release-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          echo "Creating release tag: $TAG"

          git tag "$TAG"
          git push origin "$TAG"

          echo "Release tag created successfully: $TAG"