name: Rollback - Pipeline

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag release to restore (ex: release-20260615-1230-a1b2c3d)'
        required: true
        type: string
      environment:
        description: 'target environment'
        required: true
        default: production
        type: choice
        options:
          - Production
          - QA
      run_tests:
        description: 'Run tests before deploy ?(Uncheck for emergency rollback)'
        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION: '3.11'

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}   # Production rollbacks still require manual approval.
    permissions:
      contents: read
    steps:
      - name: Checkout from release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}        # the exact state of that release

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --locked --all-groups      

      - name: Pack release
        run: |
          mkdir -p deploy-package
          rsync -a ./ deploy-package/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'antenv/' \
            --exclude '.venv/' \
            --exclude 'tests/' \
            --exclude '.pytest_cache/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc'
          uv export --locked --no-dev --format requirements-txt \
            --output-file deploy-package/requirements.txt
          echo "${GITHUB_SHA}" > deploy-package/artifact-sha.txt
      
      - name: Deploy the rollback in QA
        if: ${{ inputs.environment == 'QA' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP }}
          publish-profile: ${{ secrets.APPSERVICE_PUBLISHPROFILE }}
          package: deploy-package

      - name: Deploy the rollback in production
        if: ${{ inputs.environment == 'Production' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP }}
          publish-profile: ${{ secrets.APPSERVICE_PUBLISHPROFILE }}
          package: deploy-package